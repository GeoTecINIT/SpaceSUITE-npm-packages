<div #bokDiv [class]="getStyleClass()">
    <ng-container *ngFor="let tag of tags">
        <ng-container [ngSwitch]="tag.variant">
            <p-tag *ngSwitchCase="'primary'"
                class="primary-tag" 
                [rounded]="true" 
                [value]="tag.label"
            />

            <p-tag *ngSwitchCase="'secondary'"
                class="secondary-tag" 
                [rounded]="true" 
                [value]="tag.label"
            />

            <div *ngSwitchCase="'bok'"
            [pTooltip]="overflowTags ? tag.tooltip : undefined" 
            tooltipPosition="top" 
            [tooltipStyleClass]="getTooltipClass(tag)"
            >
                <p-tag 
                    class="bok-tag" 
                    [style.backgroundColor]="tag.color ? getBokColor(tag.color) : ''" 
                    [rounded]="true" 
                    (click)="onClickConcept(tag.label)" 
                    [value]="overflowTags ? tag.label : '[' + tag.label + '] ' + tag.tooltip"
                />
            </div>

            <p-tag *ngSwitchCase="'url'"
                class="url-tag" 
                [rounded]="true" 
                (click)="onClickUrl(tag.url ?? '')" 
                [value]="tag.label"
            />

            <p-tag *ngSwitchDefault
                class="primary-tag" 
                [rounded]="true" 
                [value]="tag.label"
            />
        </ng-container>
    </ng-container>
    <ng-content></ng-content>
</div>
