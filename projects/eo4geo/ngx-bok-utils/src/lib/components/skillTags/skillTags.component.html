<div #bokDiv [class]="getStyleClass()">
    <ng-content *ngFor="let tag of tags">
        <p-tag *ngIf="tag.variant != 'bok' else bokTag" 
            [class]="tag.variant == 'secondary' ? 'secondary-tag' : 'primary-tag'" 
            [rounded]="true" 
            [value]="tag.label"
        />
        <ng-template #bokTag>
            <div 
            [pTooltip]="overflowTags ? tag.tooltip : undefined" 
            tooltipPosition="top" 
            [tooltipStyleClass]="getTooltipClass(tag)"
            >
                <p-tag 
                    class="bok-tag" 
                    [style.backgroundColor]="tag.color ? getBokColor(tag.color) : ''" 
                    [rounded]="true" 
                    (click)="onClickConcept(tag.label)" 
                    [value]="overflowTags ? tag.label : '[' + tag.label + '] ' + tag.tooltip"
                />
            </div>
        </ng-template>
    </ng-content>
</div>
