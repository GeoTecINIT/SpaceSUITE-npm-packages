<p *ngIf="nodeSuggestions.length > 0">{{nodeSuggestions.length}} concepts</p>
<p-dataview [value]="nodeSuggestions" [rows]="8" [paginator]="true" >
    <ng-template #list let-items>
        <div class="h-4rem mt-2 pr-4" *ngFor="let item of items; let first = first">
            <a (click)="codSelectedChange.emit(item.nameShort)" style="font-weight: 400; cursor: pointer;">
                <div class="white-space-nowrap overflow-hidden text-overflow-ellipsis">
                    [{{item.nameShort}}] {{item.name}}
                </div>
            </a>
            <div class="mt-1 white-space-nowrap overflow-hidden text-overflow-ellipsis" style="font-size: 0.85em" 
            [innerHTML]="highlightDescription ? (item.description | truncate : searchValue : 25) : item.description"></div>
        </div>
    </ng-template>
</p-dataview>
