<div *ngIf="array && array.length > 0">
    <h3>{{ headline }} [{{ array.length }}]</h3>
    <p-tree [value]="formattedTree()" class="w-full custom-tree ml-0" >
        <ng-template let-node pTemplate="leaf">
            @if(node.data.bloomVerb != '') {
                @if(divideSkill(node.data) | async; as parts) {
                    <div [style.display]="'list-item'" [style.list-style-type]="'disc'">
                        <b>{{parts[0]}}</b>
                        @if(parts[1] != '') {
                            <div class="inline ml-1">{{parts[1]}}</div>
                        }
                        <span class="inline border-round-xl mx-1" [style.background]="getBackgroundColor(node.data.concept) | async">
                            {{parts[2]}}
                        </span>
                        {{parts[3]}}
                    </div>
                }
            }
            @else {
                <div [style.display]="'list-item'" [style.list-style-type]="'disc'">{{ node.label }}</div>
            }
        </ng-template>
        <ng-template let-node pTemplate="default">
            <a (click)="node.expanded = !node.expanded">{{ node.label }} ({{countChildren(node)}})</a>
        </ng-template>
    </p-tree>
</div>
