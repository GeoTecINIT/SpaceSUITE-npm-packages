<div *ngIf="array && array.length > 0">
    <h3>{{ headline }} [{{ array.length }}]</h3>
    <p-tree [value]="formattedTree()" class="w-full custom-tree ml-0" >
        <ng-template let-node pTemplate="leaf">
            <div [style.display]="'list-item'" [style.list-style-type]="'disc'"><b>{{node.data}}:</b> {{ node.label }}</div>
        </ng-template>
        <ng-template let-node pTemplate="default">
            <a (click)="node.expanded = !node.expanded">{{ node.label }} ({{countChildren(node)}})</a>
        </ng-template>
    </p-tree>
</div>
